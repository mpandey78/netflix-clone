<div class="player-container" (mousemove)="resetControlsTimer()">
    <video #videoPlayer class="video-element" (timeupdate)="onTimeUpdate()" (click)="togglePlay()"></video>

    <div class="loading-overlay" *ngIf="isLoading">
        <div class="spinner"></div>
    </div>

    <div class="controls-overlay" [class.hidden]="!showControls">
        <!-- Header -->
        <div class="player-header">
            <button class="back-btn" (click)="goBack()">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h2 class="content-title">{{ content?.title }}</h2>
        </div>

        <!-- Center Play/Pause (optional, maybe big icon flash) -->

        <!-- Footer Controls -->
        <div class="player-controls">
            <!-- Progress Bar -->
            <div class="progress-container">
                <input type="range" min="0" [max]="duration" [value]="currentTime" (input)="seek($event)"
                    class="progress-bar">
                <div class="time-display">{{ formatTime(currentTime) }} / {{ formatTime(duration) }}</div>
            </div>

            <div class="control-buttons">
                <div class="left-controls">
                    <button class="icon-btn" (click)="togglePlay()">
                        <i class="bi" [class.bi-play-fill]="!isPlaying" [class.bi-pause-fill]="isPlaying"></i>
                    </button>

                    <button class="icon-btn" (click)="goBack()">
                        <i class="bi bi-skip-backward-fill"></i>
                    </button>
                    <!-- Skip Forward -->
                    <button class="icon-btn" (click)="videoPlayer.currentTime = videoPlayer.currentTime + 10">
                        <i class="bi bi-skip-forward-fill"></i>
                    </button>

                    <div class="volume-container">
                        <button class="icon-btn" (click)="toggleMute()">
                            <i class="bi" [class.bi-volume-up-fill]="!isMuted"
                                [class.bi-volume-mute-fill]="isMuted"></i>
                        </button>
                        <input type="range" min="0" max="1" step="0.1" [value]="volume" (input)="onVolumeChange($event)"
                            class="volume-slider">
                    </div>
                </div>

                <div class="right-controls">
                    <button class="icon-btn" (click)="toggleFullscreen()">
                        <i class="bi bi-fullscreen"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
